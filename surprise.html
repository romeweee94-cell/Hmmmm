<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เซอร์ไพรส์ลับ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Sarabun:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FFF7EF;
    --blush:#FFDCD3;
    --coral:#FF6F5E;
    --plum:#452A44;
    --gold:#F3B94D;
    --mint:#BFE3D0;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 15% 20%, var(--blush) 0%, transparent 40%),
      radial-gradient(circle at 85% 80%, var(--mint) 0%, transparent 40%),
      var(--cream);
    font-family:'Sarabun', sans-serif;
    color:var(--plum);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow-x:hidden;
    padding:20px;
  }
  .stage{
    width:100%;
    max-width:480px;
    min-height:560px;
    background:#fff;
    border-radius:28px;
    box-shadow:0 20px 60px rgba(69,42,68,0.15);
    padding:32px 28px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    position:relative;
    overflow:hidden;
  }
  .screen{ display:none; width:100%; animation:fadeIn 0.5s ease; }
  .screen.active{ display:flex; flex-direction:column; align-items:center; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(12px);} to{opacity:1; transform:translateY(0);} }

  h1,h2{ font-family:'Fredoka', sans-serif; margin:0 0 8px; }
  h1{ font-size:1.6rem; color:var(--coral); }
  h2{ font-size:1.3rem; }
  p{ line-height:1.6; margin:6px 0 18px; }
  .eyebrow{
    font-family:'Fredoka', sans-serif;
    font-size:0.75rem;
    letter-spacing:0.15em;
    color:var(--coral);
    text-transform:uppercase;
    margin-bottom:6px;
  }

  button{
    font-family:'Fredoka', sans-serif;
    font-size:1rem;
    font-weight:600;
    border:none;
    border-radius:999px;
    padding:12px 28px;
    background:var(--coral);
    color:#fff;
    cursor:pointer;
    box-shadow:0 8px 20px rgba(255,111,94,0.35);
    transition:transform 0.15s ease;
  }
  button:hover{ transform:translateY(-2px); }
  button:active{ transform:translateY(0px) scale(0.97); }
  button:focus-visible{ outline:3px solid var(--gold); outline-offset:2px; }
  button.secondary{
    background:#fff;
    color:var(--coral);
    border:2px solid var(--coral);
    box-shadow:none;
  }

  .progress-dots{ display:flex; gap:6px; margin-bottom:18px; }
  .dot{ width:8px; height:8px; border-radius:50%; background:var(--blush); }
  .dot.done{ background:var(--coral); }

  /* Math game */
  .sum{
    font-family:'Fredoka', sans-serif;
    font-size:2.2rem;
    color:var(--plum);
    margin:10px 0 20px;
  }
  .choices{ display:grid; grid-template-columns:1fr 1fr; gap:12px; width:100%; }
  .choice-btn{
    background:var(--cream);
    color:var(--plum);
    border:2px solid var(--blush);
    font-size:1.1rem;
    padding:14px;
    box-shadow:none;
  }
  .choice-btn.correct{ background:var(--mint); border-color:var(--mint); }
  .choice-btn.wrong{ background:#FFD3D3; border-color:#FFD3D3; }
  .feedback{ min-height:22px; font-weight:600; margin-top:12px; }

  /* Block stacking game */
  .block-area{
    position:relative;
    width:100%;
    height:300px;
    background:linear-gradient(180deg, #FFF2E8 0%, #FFEAD9 100%);
    border-radius:18px;
    overflow:hidden;
    margin-bottom:16px;
  }
  .moving-block, .stacked-block{
    position:absolute;
    height:26px;
    border-radius:6px;
    box-shadow:0 3px 6px rgba(0,0,0,0.15);
  }
  .moving-block{ background:var(--coral); top:6px; }
  .stack-count{ font-family:'Fredoka', sans-serif; font-weight:600; margin-bottom:10px; }
  .game-msg{ min-height:22px; font-weight:600; }

  /* Envelope */
  .envelope-wrap{ margin:10px 0 24px; cursor:pointer; }
  .envelope{
    width:200px;
    height:130px;
    position:relative;
    margin:0 auto;
  }
  .env-body{
    position:absolute;
    inset:0;
    background:var(--coral);
    border-radius:8px;
  }
  .env-flap{
    position:absolute;
    top:0; left:0; right:0;
    height:0;
    border-left:100px solid transparent;
    border-right:100px solid transparent;
    border-top:65px solid #ff8a7c;
    transform-origin:top;
    transition:transform 0.6s ease;
    z-index:3;
  }
  .envelope.open .env-flap{ transform:rotateX(180deg); }
  .seal{
    position:absolute;
    top:48px; left:50%;
    transform:translateX(-50%);
    width:34px; height:34px;
    background:var(--gold);
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:16px;
    z-index:4;
    box-shadow:0 3px 6px rgba(0,0,0,0.2);
    transition:opacity 0.3s ease;
  }
  .envelope.open .seal{ opacity:0; }
  .letter{
    position:absolute;
    left:15px; right:15px;
    bottom:6px;
    height:0;
    background:#fff;
    border-radius:6px;
    overflow:hidden;
    display:flex; align-items:center; justify-content:center;
    z-index:2;
    transition:height 0.5s ease 0.3s, top 0.5s ease 0.3s;
  }
  .envelope.open .letter{ height:150px; top:-40px; box-shadow:0 6px 16px rgba(0,0,0,0.15); }
  .letter-text{
    font-family:'Fredoka', sans-serif;
    font-size:1.6rem;
    color:var(--coral);
    opacity:0;
    transition:opacity 0.4s ease 0.8s;
    text-align:center;
    padding:8px;
  }
  .envelope.open .letter-text{ opacity:1; }

  .confetti{
    position:absolute;
    top:-10px;
    border-radius:2px;
    pointer-events:none;
  }

  .hint{ font-size:0.85rem; color:#8a7a89; margin-top:10px; }
</style>
</head>
<body>

<div class="stage" id="stage">

  <!-- Screen 0: Intro -->
  <div class="screen active" id="screen-intro">
    <div class="eyebrow">มีบางอย่างรอเธออยู่</div>
    <h1>ก่อนจะถึงของเซอร์ไพรส์...</h1>
    <p>ต้องผ่านด่านเล็กๆ 2 ด่านก่อนนะ พร้อมยัง?</p>
    <button onclick="goTo('screen-math')">เริ่มเลย</button>
  </div>

  <!-- Screen 1: Math game -->
  <div class="screen" id="screen-math">
    <div class="eyebrow">ด่านที่ 1</div>
    <h2>คำนวณให้ถูกนะ</h2>
    <div class="progress-dots" id="math-dots"></div>
    <div class="sum" id="math-question">2 + 2</div>
    <div class="choices" id="math-choices"></div>
    <div class="feedback" id="math-feedback"></div>
  </div>

  <!-- Screen 2: Block game -->
  <div class="screen" id="screen-block">
    <div class="eyebrow">ด่านที่ 2</div>
    <h2>ต่อบล็อกให้ครบ</h2>
    <p style="margin-bottom:8px;">กดปุ่ม "วาง" ตอนบล็อกอยู่ตรงกลางแนวๆ กัน ต่อให้ได้ 3 ชั้น</p>
    <div class="stack-count" id="stack-count">ต่อแล้ว 0 / 3</div>
    <div class="block-area" id="block-area"></div>
    <div class="game-msg" id="block-msg"></div>
    <button id="drop-btn" onclick="dropBlock()">วาง</button>
  </div>

  <!-- Screen 3: Envelope -->
  <div class="screen" id="screen-envelope">
    <div class="eyebrow">ผ่านครบแล้ว!</div>
    <h2>กดเปิดซองได้เลย</h2>
    <div class="envelope-wrap" onclick="openEnvelope()">
      <div class="envelope" id="envelope">
        <div class="env-body"></div>
        <div class="letter"><div class="letter-text">ปูเป้ 💛</div></div>
        <div class="env-flap"></div>
        <div class="seal">💌</div>
      </div>
    </div>
    <div class="hint" id="env-hint">แตะที่ซองเพื่อเปิด</div>
  </div>

</div>

<script>
function goTo(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  if(id==='screen-math') startMathGame();
  if(id==='screen-block') startBlockGame();
}

/* ---------- Math game ---------- */
let mathIndex = 0;
let mathQuestions = [];

function genQuestions(){
  mathQuestions = [];
  for(let i=0;i<3;i++){
    const a = Math.floor(Math.random()*10)+1;
    const b = Math.floor(Math.random()*10)+1;
    const ops = ['+','-'];
    const op = i===2 ? '×' : ops[Math.floor(Math.random()*ops.length)];
    let answer, text;
    if(op==='+'){ answer=a+b; text=`${a} + ${b}`; }
    else if(op==='-'){ const hi=Math.max(a,b), lo=Math.min(a,b); answer=hi-lo; text=`${hi} - ${lo}`; }
    else { const x=Math.floor(Math.random()*5)+1, y=Math.floor(Math.random()*5)+1; answer=x*y; text=`${x} × ${y}`; }
    const choices = new Set([answer]);
    while(choices.size<4){
      const delta = Math.floor(Math.random()*7)-3;
      const wrong = answer+delta;
      if(wrong!==answer && wrong>=0) choices.add(wrong);
    }
    mathQuestions.push({text, answer, choices: shuffle([...choices])});
  }
}
function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}
function startMathGame(){
  mathIndex = 0;
  genQuestions();
  renderDots();
  renderQuestion();
}
function renderDots(){
  const wrap = document.getElementById('math-dots');
  wrap.innerHTML = '';
  for(let i=0;i<mathQuestions.length;i++){
    const d = document.createElement('div');
    d.className = 'dot' + (i<mathIndex ? ' done' : '');
    wrap.appendChild(d);
  }
}
function renderQuestion(){
  const q = mathQuestions[mathIndex];
  document.getElementById('math-question').textContent = q.text;
  document.getElementById('math-feedback').textContent = '';
  const choicesEl = document.getElementById('math-choices');
  choicesEl.innerHTML = '';
  q.choices.forEach(c=>{
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.textContent = c;
    btn.onclick = () => checkAnswer(c, btn);
    choicesEl.appendChild(btn);
  });
}
function checkAnswer(value, btn){
  const q = mathQuestions[mathIndex];
  const allBtns = document.querySelectorAll('.choice-btn');
  allBtns.forEach(b=>b.disabled=true);
  if(value === q.answer){
    btn.classList.add('correct');
    document.getElementById('math-feedback').textContent = 'ถูกต้อง! 🎉';
    document.getElementById('math-feedback').style.color = '#2f8f5b';
    setTimeout(()=>{
      mathIndex++;
      if(mathIndex >= mathQuestions.length){
        goTo('screen-block');
      } else {
        renderDots();
        renderQuestion();
      }
    }, 700);
  } else {
    btn.classList.add('wrong');
    document.getElementById('math-feedback').textContent = 'ลองใหม่นะ';
    document.getElementById('math-feedback').style.color = '#e2554a';
    setTimeout(()=>{
      allBtns.forEach(b=>{ b.disabled=false; b.classList.remove('wrong'); });
      document.getElementById('math-feedback').textContent = '';
    }, 600);
  }
}

/* ---------- Block stacking game ---------- */
let blockTimer = null;
let blockX = 0;
let blockDir = 1;
let blockWidth = 90;
let stackedBlocks = [];
let stackGoal = 3;
let areaWidth = 0;

function startBlockGame(){
  const area = document.getElementById('block-area');
  area.innerHTML = '';
  stackedBlocks = [];
  blockWidth = 90;
  document.getElementById('stack-count').textContent = `ต่อแล้ว 0 / ${stackGoal}`;
  document.getElementById('block-msg').textContent = '';
  document.getElementById('drop-btn').disabled = false;
  areaWidth = area.clientWidth;
  blockX = 0;
  blockDir = 1;
  spawnMovingBlock();
  if(blockTimer) clearInterval(blockTimer);
  blockTimer = setInterval(()=>{
    blockX += blockDir * 3;
    if(blockX + blockWidth >= areaWidth || blockX <= 0) blockDir *= -1;
    const mb = document.getElementById('moving-block');
    if(mb) mb.style.left = blockX + 'px';
  }, 16);
}
function spawnMovingBlock(){
  const area = document.getElementById('block-area');
  const old = document.getElementById('moving-block');
  if(old) old.remove();
  const mb = document.createElement('div');
  mb.className = 'moving-block';
  mb.id = 'moving-block';
  mb.style.width = blockWidth + 'px';
  mb.style.background = ['#FF6F5E','#F3B94D','#BFE3D0','#9BB7D4'][stackedBlocks.length % 4];
  area.appendChild(mb);
  blockX = 0;
  blockDir = 1;
}
function dropBlock(){
  const area = document.getElementById('block-area');
  const mb = document.getElementById('moving-block');
  if(!mb) return;
  const currentLeft = blockX;
  const currentWidth = blockWidth;

  let overlapStart = 0, overlapEnd = currentWidth;
  if(stackedBlocks.length > 0){
    const prev = stackedBlocks[stackedBlocks.length-1];
    overlapStart = Math.max(prev.left, currentLeft);
    overlapEnd = Math.min(prev.left+prev.width, currentLeft+currentWidth);
  }
  const overlapWidth = overlapEnd - overlapStart;

  if(overlapWidth <= 15){
    document.getElementById('block-msg').textContent = 'พลาดไปนิดนึง ลองใหม่นะ 😅';
    document.getElementById('block-msg').style.color = '#e2554a';
    resetBlockStack();
    return;
  }

  const newLeft = overlapStart;
  const newWidth = overlapWidth;
  const bottom = stackedBlocks.length * 30;

  const placed = document.createElement('div');
  placed.className = 'stacked-block';
  placed.style.width = newWidth + 'px';
  placed.style.left = newLeft + 'px';
  placed.style.bottom = bottom + 'px';
  placed.style.background = mb.style.background;
  area.appendChild(placed);
  mb.remove();

  stackedBlocks.push({left:newLeft, width:newWidth});
  blockWidth = newWidth;
  document.getElementById('stack-count').textContent = `ต่อแล้ว ${stackedBlocks.length} / ${stackGoal}`;
  document.getElementById('block-msg').textContent = 'เยี่ยม! 👍';
  document.getElementById('block-msg').style.color = '#2f8f5b';

  if(stackedBlocks.length >= stackGoal){
    clearInterval(blockTimer);
    document.getElementById('drop-btn').disabled = true;
    document.getElementById('block-msg').textContent = 'ผ่านด่านแล้ว! 🎉';
    setTimeout(()=>goTo('screen-envelope'), 900);
  } else {
    spawnMovingBlock();
  }
}
function resetBlockStack(){
  clearInterval(blockTimer);
  const area = document.getElementById('block-area');
  area.innerHTML = '';
  stackedBlocks = [];
  blockWidth = 90;
  document.getElementById('stack-count').textContent = `ต่อแล้ว 0 / ${stackGoal}`;
  setTimeout(()=>{
    document.getElementById('block-msg').textContent = '';
    spawnMovingBlock();
    blockTimer = setInterval(()=>{
      blockX += blockDir * 3;
      if(blockX + blockWidth >= areaWidth || blockX <= 0) blockDir *= -1;
      const mb = document.getElementById('moving-block');
      if(mb) mb.style.left = blockX + 'px';
    }, 16);
  }, 900);
}

/* ---------- Envelope ---------- */
function openEnvelope(){
  const env = document.getElementById('envelope');
  if(env.classList.contains('open')) return;
  env.classList.add('open');
  document.getElementById('env-hint').textContent = '';
  launchConfetti();
}
function launchConfetti(){
  const stage = document.getElementById('stage');
  const colors = ['#FF6F5E','#F3B94D','#BFE3D0','#9BB7D4','#FFB3A7'];
  for(let i=0;i<40;i++){
    const c = document.createElement('div');
    c.className = 'confetti';
    const size = 6 + Math.random()*6;
    c.style.width = size+'px';
    c.style.height = (size*0.4)+'px';
    c.style.left = Math.random()*100+'%';
    c.style.background = colors[Math.floor(Math.random()*colors.length)];
    c.style.transform = `rotate(${Math.random()*360}deg)`;
    stage.appendChild(c);
    const duration = 1800 + Math.random()*1200;
    const drift = (Math.random()-0.5)*120;
    c.animate([
      { transform: c.style.transform + ' translate(0,0)', opacity:1 },
      { transform: `rotate(${Math.random()*720}deg) translate(${drift}px, 620px)`, opacity:0 }
    ], { duration, easing:'ease-in' });
    setTimeout(()=>c.remove(), duration+50);
  }
}
</script>

</body>
</html>
